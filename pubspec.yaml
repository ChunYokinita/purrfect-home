name: purrfect_home
description: A cozy cat care and room decoration game.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.13.5
  flutter: '>=3.47.6'

dependencies:
  flutter:
    sdk: flutter
  flame: ^1.38.2
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/OFL-fraunces.txt
    - assets/fonts/OFL-nunitosans.txt
  fonts:
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces.ttf
    - family: Nunito Sans
      fonts:
        - asset: assets/fonts/NunitoSans.ttf
